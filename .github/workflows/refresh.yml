name: Aggiorna dataset

# La pipeline gira qui, non nell'app: l'app Streamlit legge solo artefatti.
# Gli artefatti vengono pubblicati come asset di una Release, non committati,
# per non gonfiare il repository.

on:
  schedule:
    - cron: "30 7 2 * *"   # il 2 di ogni mese alle 07:30 UTC, a mercati chiusi
  workflow_dispatch:
    inputs:
      limit:
        description: "Scarica solo i primi N ticker (0 = tutti). Utile per provare."
        required: false
        default: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Necessario per creare la Release: dal 2023 il GITHUB_TOKEN dei repository
    # nuovi ha permessi di sola lettura, e lo step finale fallirebbe con 403
    # dopo aver gia' consumato tutte le chiamate API.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Un caricamento manuale incompleto (tipico con l'uploader web di GitHub,
      # che nasconde le cartelle col punto) altrimenti si manifesta piu' avanti
      # con errori poco leggibili. Meglio dirlo subito e per nome.
      - name: Verifica struttura del repository
        run: |
          missing=0
          for path in app.py requirements.txt exclusions.csv track pages pipeline tests \
                      track/features.py track/backtest.py track/study.py \
                      track/constituents.py track/universe.py track/storage.py \
                      track/analysis.py track/didactics.py track/ui.py \
                      track/exclusions.py \
                      pipeline/build_dataset.py pipeline/verify_data.py \
                      pipeline/fetch_dataset.py pipeline/find_bad_series.py \
                      tests/__init__.py \
                      tests/test_features.py tests/test_backtest.py \
                      tests/test_constituents.py tests/test_storage.py \
                      tests/test_attribution.py tests/test_exclusions.py; do
            if [ ! -e "$path" ]; then
              echo "::error::MANCANTE nel repository: $path"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Alcuni file non sono stati caricati su GitHub."
            echo "Contenuto attuale della radice del repository:"
            ls -la
            exit 1
          fi
          echo "Struttura del repository completa."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test (il no-lookahead deve passare prima di toccare i dati)
        run: python -m pytest tests -q

      # I costituenti arrivano dalla ricostruzione MIT su GitHub, non da EODHD:
      # l'endpoint sugli indici e' incluso solo in alcuni piani.
      - name: Verifica preliminare dei dati
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m pipeline.verify_data --sample 30 --constituents-source github

      - name: Costruisci il dataset
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python -m pipeline.build_dataset \
            --constituents-source github \
            --limit ${{ github.event.inputs.limit || 0 }}

      - name: Comprimi gli artefatti
        run: |
          cd data
          tar -czf ../la-pista-data.tar.gz *.parquet manifest.json
          cd ..
          ls -lh la-pista-data.tar.gz
          echo "Contenuto dell'archivio:"
          tar -tzf la-pista-data.tar.gz

      # L'app rifiuta un archivio incompleto: meglio accorgersene qui.
      - name: Controlla che l'archivio sia completo
        run: |
          python - <<'PY'
          import sys, tarfile
          from track.storage import PANELS
          with tarfile.open("la-pista-data.tar.gz") as t:
              names = set(t.getnames())
          missing = [f"{p}.parquet" for p in PANELS if f"{p}.parquet" not in names]
          if missing:
              print(f"::error::Archivio incompleto, mancano: {', '.join(missing)}")
              sys.exit(1)
          print(f"Archivio completo: {len(names)} file.")
          PY

      # Rete di sicurezza: se la Release fallisce, il dataset resta comunque
      # scaricabile dalla pagina del run per 30 giorni invece di andare perso.
      - name: Salva come artefatto del run
        uses: actions/upload-artifact@v4
        with:
          name: la-pista-data
          path: la-pista-data.tar.gz
          retention-days: 30

      - name: Pubblica come Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ github.run_number }}
          name: Dataset ${{ github.run_number }}
          files: la-pista-data.tar.gz
          body: |
            Dataset generato automaticamente.
            Scaricare e scompattare in `data/` prima di avviare l'app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
